<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuzhan Chocolate — Handmade Artisan Chocolate | Small-Batch Bars, Bonbons &amp; Gifts</title>
    <meta
      name="description"
      content="Nuzhan Chocolate crafts small-batch handmade chocolate: 68% dark loaded tablets, nut & berry eclair bars, artisan bonbons, chocopops, dipped strawberries and signature gift boxes."
    />
    <meta
      name="keywords"
      content="Nuzhan Chocolate, handmade chocolate, artisan chocolate, dark chocolate 68%, chocolate bars, bonbons, pralines, gift box, chocopop, chocolate covered strawberries"
    />
    <meta name="author" content="Nuzhan Chocolate" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://nuzhanchocolate.com/" />

    <!-- Favicons (brand mark derived from the Nuzhan logo) -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d0f07" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nuzhan Chocolate" />
    <meta property="og:title" content="Nuzhan Chocolate — Handmade Artisan Chocolate" />
    <meta
      property="og:description"
      content="Small-batch handmade chocolate: loaded 68% dark tablets, eclair bars, bonbons, chocopops and gift boxes — poured, scattered and finished by hand."
    />
    <meta property="og:url" content="https://nuzhanchocolate.com/" />
    <meta property="og:image" content="https://nuzhanchocolate.com/assets/img/photo-filled-sticks.jpg" />
    <meta property="og:image:alt" content="Handmade Nuzhan chocolate sticks with nuts, cut open to show the filling" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1350" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nuzhan Chocolate — Handmade Artisan Chocolate" />
    <meta
      name="twitter:description"
      content="Small-batch handmade chocolate: loaded tablets, eclair bars, bonbons, chocopops and gift boxes."
    />
    <meta name="twitter:image" content="https://nuzhanchocolate.com/assets/img/photo-filled-sticks.jpg" />

    <!-- Fonts: Fraunces (display) + Manrope (body) + Vazirmatn (Persian wordmark نوژان) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400..800&family=Vazirmatn:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Hero image preloads for instant first paint -->
    <link rel="preload" as="image" href="/assets/img/photo-filled-sticks.jpg" fetchpriority="high" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nuzhan Chocolate",
        "alternateName": "نوژان",
        "description": "Handmade small-batch artisan chocolate: loaded tablets, eclair bars, bonbons, chocopops and gift boxes.",
        "url": "https://nuzhanchocolate.com/",
        "logo": "https://nuzhanchocolate.com/icons/icon-512.png",
        "sameAs": ["https://instagram.com/nuzhan.chocolate"],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+98-903-397-7930",
          "contactType": "sales"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Nuzhan Chocolate Collection",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "68% Dark Loaded Tablets" },
          { "@type": "ListItem", "position": 2, "name": "Nut & Berry Eclair Bars" },
          { "@type": "ListItem", "position": 3, "name": "Gianduja Filled Sticks" },
          { "@type": "ListItem", "position": 4, "name": "Artisan Bonbons" },
          { "@type": "ListItem", "position": 5, "name": "Chocopops & Dipped Strawberries" },
          { "@type": "ListItem", "position": 6, "name": "Signature Gift Boxes" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: serif; padding: 2rem; text-align: center">
        Nuzhan Chocolate — handmade artisan chocolate. Please enable JavaScript for the full tasting experience, or
        find us on Instagram @nuzhan.chocolate.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
